apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-check
  namespace: raghad-capstone
spec:
  metrics:
    - name: error-rate
      interval: 30s
      count: 3
      failureLimit: 1
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(http_requests_total{status="500"}[2m]))
              /
              sum(rate(http_requests_total[2m]))
            ) or vector(0)
      successCondition: len(result) > 0 && result[0] < 0.05
